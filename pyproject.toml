[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klab"
version = "0.1.0"
description = "Pre-registered multi-timeframe key-level trading research laboratory"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.15,<1",
  "matplotlib>=3.8,<4",
  "pyarrow>=26",
  "PyYAML>=6",
  "requests>=2.32",
  "curl_cffi>=0.16",
  "beautifulsoup4>=4.15",
  "tqdm>=4.68",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
klab = "klab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
